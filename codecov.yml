# Coverage is split by runtime/test surface. Thresholds remain
# non-blocking while the test suite establishes measured baselines.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# These are process entrypoints rather than independently testable business
# logic. main.rs and the frontend bootstrap are covered by startup/build/E2E
# checks rather than unit-coverage targets.
ignore:
  - "src/main.rs"
  - "src/frontend/src/main.tsx"

# Keep Codecov flag names aligned with the flags uploaded by
# .github/workflows/ci-coverage-upload.yml.
flag_management:
  individual_flags:
    - name: unit-backend
      paths:
        - "src/mydns/**"
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

    - name: unit-frontend
      paths:
        - "src/frontend/**"
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

    - name: component-backend
      paths:
        - "src/mydns/**"
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

    - name: integration-backend
      paths:
        - "src/mydns/**"
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

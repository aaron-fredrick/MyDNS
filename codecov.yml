coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flag_management:
  individual_flags:
    - name: backend
      paths:
        - src/
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%
    - name: frontend
      paths:
        - src/frontend/
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

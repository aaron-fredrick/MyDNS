# Coverage is intentionally split by runtime surface. Thresholds remain
# non-blocking until the expanded suite establishes a measured baseline.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# These are process entrypoints rather than independently testable business
# logic. Their behavior is verified by build/startup/E2E smoke jobs instead of
# inflating line-coverage targets with tracing/bootstrap plumbing.
ignore:
  - "src/main.rs"
  - "src/frontend/src/main.tsx"

flag_management:
  individual_flags:
    - name: backend
      paths:
        - src/
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%
    - name: frontend
      paths:
        - src/frontend/
      statuses:
        - type: project
          target: auto
          threshold: 1%
        - type: patch
          target: auto
          threshold: 1%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

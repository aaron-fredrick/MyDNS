[server]
bind_host = "127.0.0.1"
dns_port = 5353
http_host = "127.0.0.1"
http_port = 18080
run_as_user = "nobody"
run_as_group = "nogroup"

[database]
path = "ci-mydns.db"

[auth]
admin_username = "admin"
admin_password = "changeme123"
jwt_secret = "ci-only-test-secret-012345678901234567890123456789"

[resolver]
mode = "forwarding"
priority = "cloudflare_first"
cloudflare_dns = "1.1.1.1:53"

[zones]
authoritative = ["home.arpa"]
dashboard_domain = "mydns.local"
cors_domains = ["127.0.0.1"]

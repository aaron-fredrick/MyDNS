name: CI Capability - Unit Tests
on:
  workflow_call:
jobs:
  rust-unit:
    name: Tests (${{ matrix.platform }} ${{ matrix.arch }}) - Rust unit tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x64
            runner: ubuntu-latest
            coverage: true
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
            coverage: false
          - platform: Windows
            arch: x64
            runner: windows-latest
            coverage: false
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
            coverage: false
          - platform: macOS
            arch: x64
            runner: macos-15-intel
            coverage: false
          - platform: macOS
            arch: ARM64
            runner: macos-15
            coverage: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --all-features
      - if: ${{ matrix.coverage }}
        uses: taiki-e/install-action@cargo-llvm-cov
      - if: ${{ matrix.coverage }}
        name: Prepare backend coverage directory
        shell: bash
        run: mkdir -p coverage/backend
      - if: ${{ matrix.coverage }}
        name: Generate backend coverage
        shell: bash
        run: cargo llvm-cov --lib --all-features --lcov --output-path coverage/backend/lcov.info
      - if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage/backend/lcov.info
          retention-days: 14

  frontend:
    name: Tests (Linux) - Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text --reports-dir=coverage/frontend node --experimental-strip-types --test tests/unit/frontend/*.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/frontend/lcov.info
          retention-days: 14

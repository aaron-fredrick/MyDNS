name: CI Capability - Unit Tests
on:
  workflow_call:
jobs:
  backend-unit:
    name: Tests (Backend) - Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build frontend assets
        shell: bash
        run: |
          npm ci
          npm run build
          rm -rf out/web
          mkdir -p out
          mv src/web/dist out/web
      - name: Prepare backend coverage directory
        shell: bash
        run: mkdir -p coverage/unit/backend
      - name: Generate backend coverage
        id: backend-coverage
        continue-on-error: true
        shell: bash
        run: cargo llvm-cov --lib --all-features --no-fail-fast --lcov --output-path coverage/unit/backend/lcov.info
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit-backend
          path: coverage/unit/backend/lcov.info
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail backend unit job if coverage tests failed
        if: steps.backend-coverage.outcome == 'failure'
        shell: bash
        run: exit 1

  frontend:
    name: Tests (Frontend) - Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate frontend coverage
        id: frontend-coverage
        continue-on-error: true
        run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text --reports-dir=coverage/unit/frontend node --experimental-strip-types --test tests/unit/frontend/*.test.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit-frontend
          path: coverage/unit/frontend/lcov.info
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail frontend unit job if coverage tests failed
        if: steps.frontend-coverage.outcome == 'failure'
        shell: bash
        run: exit 1

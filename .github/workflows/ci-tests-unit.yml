name: CI Capability - Unit Tests
on:
  workflow_call:
jobs:
  backend-linux:
    name: Rust unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        run: cargo test --lib --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate Rust unit coverage
        run: cargo llvm-cov --lib --all-features --lcov --output-path coverage/backend/lcov.info
      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage/backend/lcov.info
          retention-days: 14
  backend-windows:
    name: Rust unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust unit tests
        run: cargo test --lib --all-features
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests with coverage
        run: |
          npx --yes c8@10.1.3             --reporter=lcov             --reporter=text             --reports-dir=coverage/frontend             node --experimental-strip-types --test tests/unit/frontend/*.test.ts
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/frontend/lcov.info
          retention-days: 14

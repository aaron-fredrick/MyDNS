name: CI

on:
  push:
    branches: [ main, production-readiness ]
  pull_request:
    branches: [ main, production-readiness ]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Quality, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Unit Tests with Coverage
        run: |
          npx --yes c8@10.1.3 \
            --reporter=lcov \
            --reporter=text \
            --reports-dir=coverage/frontend \
            node --experimental-strip-types --test tests/unit/frontend/*.test.ts

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/frontend/lcov.info
          fail_ci_if_error: false
          flags: frontend
          name: frontend-coverage

      - name: Build Dashboard
        run: npm run build

  lint-and-format:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for frontend build artifacts)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-and-coverage:
    name: Test & Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests with Coverage
        # --all-targets includes all explicitly registered integration test crates.
        # --all-features ensures conditional-compilation paths are covered.
        # --lcov produces a Codecov-compatible LCOV report.
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload Backend Coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
          flags: backend
          name: backend-coverage

  build-release:
    name: Release Build (${{ matrix.os }})
    needs: [frontend, lint-and-format, test-and-coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --verbose

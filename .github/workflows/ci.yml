name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch:
    name: Branch push (light)
    if: github.event_name == 'push' && github.ref_name != 'dev' && github.ref_name != 'main'
    uses: ./.github/workflows/ci-policy-branch.yml
  pr:
    name: Pull request (deeper)
    if: github.event_name == 'pull_request' && github.base_ref != 'dev' && github.base_ref != 'main'
    uses: ./.github/workflows/ci-policy-pr.yml

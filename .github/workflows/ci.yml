name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Dashboard
        run: npm run build

      # NOTE: Frontend coverage is not yet configured.
      # The frontend (React + Vite) currently has no test framework installed.
      # When frontend tests are added (e.g., Vitest), add a coverage step here
      # and upload to Codecov with: flags: frontend

  lint-and-format:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for frontend build artifacts)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-and-coverage:
    name: Test & Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests with Coverage
        # --all-targets includes all integration test crates in tests/
        # --all-features ensures conditional-compilation paths are covered
        # --lcov produces a Codecov-compatible LCOV report
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload Backend Coverage to Codecov
        # Only upload from ubuntu-latest to avoid double-counting the same
        # coverage data from the windows-latest matrix leg.
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: backend
          name: backend-coverage

  build-release:
    name: Release Build (${{ matrix.os }})
    needs: [frontend, lint-and-format, test-and-coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --verbose


name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Quality, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Frontend Unit Tests with Coverage
        run: |
          npx --yes c8@10.1.3 \
            --reporter=lcov \
            --reporter=text \
            --reports-dir=coverage/frontend \
            node --experimental-strip-types --test tests/unit/frontend/*.test.ts

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage/frontend/lcov.info
          fail_ci_if_error: false
          flags: frontend
          name: frontend-coverage

      - name: Build Dashboard
        run: npm run build

  lint-and-format:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for frontend build artifacts)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-and-coverage:
    name: Test & Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests with Coverage
        # --all-targets includes all explicitly registered integration test crates.
        # --all-features ensures conditional-compilation paths are covered.
        # --lcov produces a Codecov-compatible LCOV report.
        run: cargo llvm-cov --all-targets --all-features --lcov --output-path lcov.info

      - name: Upload Backend Coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
          flags: backend
          name: backend-coverage


  black-box-smoke:
    name: E2E, DNS Smoke & Bounded Load
    needs: [frontend, lint-and-format, test-and-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare isolated test configuration
        run: cp tests/fixtures/ci-config.toml config.toml

      - name: Start MyDNS
        shell: bash
        run: |
          ./target/release/mydns > mydns-ci.log 2>&1 &
          echo $! > mydns.pid

      - name: Wait for HTTP readiness
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:18080/api/v1/stats"
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit("MyDNS did not become ready within 30 seconds")
          PY

      - name: Run API and DNS E2E workflow
        run: |
          python3 tests/e2e/api_e2e.py             --base-url http://127.0.0.1:18080             --username admin             --password changeme123             --dns-port 5353

      - name: Run DNS smoke
        run: python3 tests/smoke/dns-smoke.py --port 5353

      - name: Run HTTP smoke
        env:
          MYDNS_ADMIN_PASSWORD: changeme123
        shell: pwsh
        run: ./tests/smoke/api-smoke.ps1 -BaseUrl http://127.0.0.1:18080

      - name: Run bounded DNS load smoke
        run: python3 tests/load/dns_load.py --scenario tests/load/scenarios/ci-dns-smoke.json

      - name: Run bounded API load smoke
        run: python3 tests/load/api_load.py --scenario tests/load/scenarios/ci-api-smoke.json

      - name: Dump MyDNS log on failure
        if: failure()
        run: |
          if [ -f mydns-ci.log ]; then
            cat mydns-ci.log
          fi

      - name: Stop MyDNS
        if: always()
        shell: bash
        run: |
          if [ -f mydns.pid ]; then
            kill "$(cat mydns.pid)" || true
            wait "$(cat mydns.pid)" 2>/dev/null || true
          fi
          rm -f mydns.pid mydns-ci.log ci-mydns.db ci-mydns.db-shm ci-mydns.db-wal config.toml

  build-release:
    name: Release Build (${{ matrix.os }})
    needs: [frontend, lint-and-format, test-and-coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --verbose

name: CI Capability - Codecov Upload
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v5
        with:
          name: coverage-backend
          path: coverage/backend
      - uses: actions/download-artifact@v5
        with:
          name: coverage-frontend
          path: coverage/frontend

      - name: Verify coverage reports
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/backend/lcov.info
          test -s coverage/frontend/lcov.info
          echo "Checked out commit:"
          git rev-parse HEAD
          echo "Backend SF paths:"
          grep '^SF:' coverage/backend/lcov.info | head -50
          echo "Frontend SF paths:"
          grep '^SF:' coverage/frontend/lcov.info | head -50

      - name: Upload backend coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/backend/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: true
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/frontend/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

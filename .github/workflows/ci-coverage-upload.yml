name: CI Capability - Codecov Upload
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true
jobs:
  upload:
    name: Coverage - Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: coverage

      - name: Report available coverage
        shell: bash
        run: |
          set -euo pipefail
          find coverage -type f -name 'lcov.info' -print

      - name: Upload unit backend coverage
        if: hashFiles('coverage/coverage-unit-backend/lcov.info') != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/coverage-unit-backend/lcov.info
          flags: unit-backend
          name: unit-backend
          fail_ci_if_error: true

      - name: Upload unit frontend coverage
        if: hashFiles('coverage/coverage-unit-frontend/lcov.info') != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/coverage-unit-frontend/lcov.info
          flags: unit-frontend
          name: unit-frontend
          fail_ci_if_error: true

      - name: Upload component backend coverage
        if: hashFiles('coverage/coverage-component-backend/lcov.info') != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/coverage-component-backend/lcov.info
          flags: component-backend
          name: component-backend
          fail_ci_if_error: true

      - name: Upload integration backend coverage
        if: hashFiles('coverage/coverage-integration-backend/lcov.info') != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          disable_search: true
          files: coverage/coverage-integration-backend/lcov.info
          flags: integration-backend
          name: integration-backend
          fail_ci_if_error: true

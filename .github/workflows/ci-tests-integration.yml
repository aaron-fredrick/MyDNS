name: CI Capability - Integration Tests
on:
  workflow_call:
jobs:
  integration:\n    name: Test (Linux) — Integration\n    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --tests --all-features --no-fail-fast

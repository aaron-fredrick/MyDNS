name: CI Capability - Backend Integration Tests
on:
  workflow_call:
jobs:
  backend-integration:
    name: Tests (Backend) - Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --tests --all-features --no-fail-fast

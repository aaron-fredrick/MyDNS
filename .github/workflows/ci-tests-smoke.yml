name: CI Capability - Smoke Tests
on:
  workflow_call:
jobs:
  smoke:
    name: Test (${{ matrix.platform }} ${{ matrix.arch }}) - Smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x64
            runner: ubuntu-latest
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
          - platform: Windows
            arch: x64
            runner: windows-latest
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
          - platform: macOS
            arch: x64
            runner: macos-15-intel
          - platform: macOS
            arch: ARM64
            runner: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Choose CI DNS port
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket

          for port in range(20000, 40000):
              udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              tcp = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  udp.bind(("127.0.0.1", port))
                  tcp.bind(("127.0.0.1", port))
                  print(f"MYDNS_DNS_PORT={port}")
                  break
              except OSError:
                  continue
              finally:
                  udp.close()
                  tcp.close()
          else:
              raise SystemExit("Could not find a free CI DNS port")
          PY
      - name: Prepare CI config
        shell: bash
        run: |
          cp tests/fixtures/ci-config.toml config.toml
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("config.toml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(r"(?m)^dns_port = \d+$", f"dns_port = {os.environ['MYDNS_DNS_PORT']}", text)
          if count != 1:
              raise SystemExit("Expected exactly one dns_port setting in CI config")
          path.write_text(text, encoding="utf-8")
          print(f"Configured MyDNS DNS port: {os.environ['MYDNS_DNS_PORT']}")
          PY
      - name: Start MyDNS (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/mydns > mydns-ci.log 2>&1 &
          echo $! > mydns.pid
      - name: Start MyDNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\target\release\mydns.exe" -RedirectStandardOutput "mydns-ci.log" -RedirectStandardError "mydns-ci-error.log" -PassThru
          $process.Id | Out-File -FilePath mydns.pid -Encoding ascii
      - name: Wait for HTTP readiness (Unix)
        if: runner.os != 'Windows'
        shell: python
        run: |
          import socket
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 18080), timeout=2):
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.5)
          raise SystemExit("MyDNS HTTP listener did not become ready")

      - name: Wait for HTTP readiness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(30)
          $processId = [int](Get-Content mydns.pid)

          while ((Get-Date) -lt $deadline) {
            $process = Get-Process -Id $processId -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "MyDNS exited before HTTP became reachable."
              if (Test-Path mydns-ci.log) { Get-Content mydns-ci.log }
              if (Test-Path mydns-ci-error.log) { Get-Content mydns-ci-error.log }
              throw "MyDNS exited before HTTP became reachable"
            }

            if (Test-NetConnection -ComputerName 127.0.0.1 -Port 18080 -InformationLevel Quiet) {
              Write-Host "MyDNS HTTP listener is accepting TCP connections on 127.0.0.1:18080."
              exit 0
            }

            Start-Sleep -Milliseconds 500
          }

          Write-Host "MyDNS is still running, but HTTP port 18080 is not accepting connections."
          if (Test-Path mydns-ci.log) { Get-Content mydns-ci.log }
          if (Test-Path mydns-ci-error.log) { Get-Content mydns-ci-error.log }
          throw "MyDNS HTTP listener did not become reachable"
      - name: DNS smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/smoke/dns-smoke.py --port "$MYDNS_DNS_PORT"
      - name: HTTP smoke
        env:
          MYDNS_ADMIN_PASSWORD: changeme123
        shell: pwsh
        run: ./tests/smoke/api-smoke.ps1 -BaseUrl http://127.0.0.1:18080
      - name: DNS load smoke
        shell: bash
        run: python tests/load/dns_load.py --scenario tests/load/scenarios/ci-dns-smoke.json
      - name: API load smoke
        shell: bash
        run: python tests/load/api_load.py --scenario tests/load/scenarios/ci-api-smoke.json
      - name: Dump MyDNS log (Unix)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: cat mydns-ci.log || true
      - name: Dump MyDNS log (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path mydns-ci.log) { Get-Content mydns-ci.log }
          if (Test-Path mydns-ci-error.log) { Get-Content mydns-ci-error.log }
      - name: Stop MyDNS (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f mydns.pid ]; then
            kill "$(cat mydns.pid)" || true
            wait "$(cat mydns.pid)" 2>/dev/null || true
          fi
          rm -f mydns.pid mydns-ci.log config.toml
      - name: Stop MyDNS (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path mydns.pid) {
            $processId = [int](Get-Content mydns.pid)
            Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Force -ErrorAction SilentlyContinue mydns.pid, mydns-ci.log, mydns-ci-error.log, config.toml, ci-mydns.db, ci-mydns.db-shm, ci-mydns.db-wal

name: CI Capability - E2E
on:
  workflow_call:
jobs:
  e2e:
    name: Test (${{ matrix.platform }} ${{ matrix.arch }}) - E2E
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x64
            runner: ubuntu-latest
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
          - platform: Windows
            arch: x64
            runner: windows-latest
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm
          - platform: macOS
            arch: x64
            runner: macos-15-intel
          - platform: macOS
            arch: ARM64
            runner: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Prepare CI config
        shell: bash
        run: cp tests/fixtures/ci-config.toml config.toml
      - name: Start MyDNS (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/mydns > mydns-e2e.log 2>&1 &
          echo $! > mydns.pid
      - name: Start MyDNS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\target\release\mydns.exe" -RedirectStandardOutput "mydns-e2e.log" -RedirectStandardError "mydns-e2e-error.log" -PassThru
          $process.Id | Out-File -FilePath mydns.pid -Encoding ascii
      - name: Wait for HTTP readiness
        shell: python
        run: |
          import time
          import urllib.request

          url = "http://127.0.0.1:18080/api/v1/stats"
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.5)
          raise SystemExit("MyDNS did not become ready")
      - name: API and DNS E2E
        shell: python
        run: python tests/e2e/api_e2e.py --base-url http://127.0.0.1:18080 --username admin --password changeme123 --dns-port 15353
      - name: Dump MyDNS log (Unix)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: cat mydns-e2e.log || true
      - name: Dump MyDNS log (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path mydns-e2e.log) { Get-Content mydns-e2e.log }
          if (Test-Path mydns-e2e-error.log) { Get-Content mydns-e2e-error.log }
      - name: Stop MyDNS (Unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f mydns.pid ]; then
            kill "$(cat mydns.pid)" || true
            wait "$(cat mydns.pid)" 2>/dev/null || true
          fi
          rm -f mydns.pid mydns-e2e.log config.toml
      - name: Stop MyDNS (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path mydns.pid) {
            $processId = [int](Get-Content mydns.pid)
            Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Force -ErrorAction SilentlyContinue mydns.pid, mydns-e2e.log, mydns-e2e-error.log, config.toml, ci-mydns.db, ci-mydns.db-shm, ci-mydns.db-wal

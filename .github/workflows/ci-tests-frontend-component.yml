name: CI Capability - Frontend Component Tests
on:
  workflow_call:
jobs:
  frontend-component:
    name: Test (Linux) - Frontend component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend component gate
        run: npm run typecheck

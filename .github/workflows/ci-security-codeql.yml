name: CI Capability - Security CodeQL
on:
  workflow_call:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security-backend-codeql:
    name: Security (Backend) - CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
  security-frontend-codeql:
    name: Security (Frontend) - CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

name: CI Capability - Security Audit
on:
  workflow_call:
jobs:
  security-backend:
    name: Security (Backend) - Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Verify RSA advisory dependency is inactive
        shell: bash
        run: |
          if cargo tree -e normal | grep -Eq '^rsa v0\\.9\\.10( |$)'; then
            echo "rsa 0.9.10 is active in MyDNS's normal dependency graph."
            exit 1
          fi
      - run: cargo audit

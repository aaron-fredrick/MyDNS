name: CI Capability - Release Build
on:
  workflow_call:
jobs:
  release:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }}) - Release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x64
            runner: ubuntu-latest\n            artifact: mydns-linux-x64
          - platform: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm\n            artifact: mydns-linux-arm64
          - platform: Windows
            arch: x64
            runner: windows-latest\n            artifact: mydns-windows-x64
          - platform: Windows
            arch: ARM64
            runner: windows-11-arm\n            artifact: mydns-windows-arm64
          - platform: macOS
            arch: x64
            runner: macos-15-intel\n            artifact: mydns-macos-x64
          - platform: macOS
            arch: ARM64
            runner: macos-15\n            artifact: mydns-macos-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --verbose
      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/mydns
            target/release/mydns.exe
          if-no-files-found: error
          retention-days: 1

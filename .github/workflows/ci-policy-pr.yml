name: CI Policy - Pull Request
on:
  workflow_call:
jobs:
  lint:
    uses: ./.github/workflows/ci-lint-full.yml
  static-full:
    uses: ./.github/workflows/ci-static-full.yml
  build:
    needs: [lint, static-full]
    uses: ./.github/workflows/ci-build-release.yml
  unit:
    needs: build
    uses: ./.github/workflows/ci-tests-unit.yml
  component:
    needs: unit
    uses: ./.github/workflows/ci-tests-component.yml
  contract:
    needs: component
    uses: ./.github/workflows/ci-tests-contract.yml
  integration:
    needs: contract
    uses: ./.github/workflows/ci-tests-integration.yml
  smoke:
    needs: integration
    uses: ./.github/workflows/ci-tests-smoke.yml
  build-check:
    needs: integration
    uses: ./.github/workflows/ci-build-check.yml

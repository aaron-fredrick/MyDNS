name: CI Policy - Pull Request
on:
  workflow_call:
jobs:
  lint:
    uses: ./.github/workflows/ci-lint-full.yml
  static-full:
    uses: ./.github/workflows/ci-static-full.yml
  unit:
    needs: [lint, static-full]
    uses: ./.github/workflows/ci-tests-unit.yml
    with:
      include_integration_coverage: true
  integration:
    needs: unit
    uses: ./.github/workflows/ci-tests-integration.yml
  smoke:
    needs: [unit, integration]
    uses: ./.github/workflows/ci-tests-smoke.yml
  build-check:
    needs: [unit, integration]
    uses: ./.github/workflows/ci-build-check.yml

name: CI Capability - Component Tests
on:
  workflow_call:
jobs:
  backend-component:
    name: Tests (Backend) - Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Backend component tests
        run: cargo test --lib --all-features --no-fail-fast

  frontend-component:
    name: Tests (Frontend) - Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend component gate
        run: npm run typecheck

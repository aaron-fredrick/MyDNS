name: CI Capability - Component Tests
on:
  workflow_call:
jobs:
  backend-component:
    name: Tests (Backend) - Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Backend component tests
        run: cargo test --lib --all-features --no-fail-fast
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Prepare backend coverage directory
        shell: bash
        run: mkdir -p coverage/component/backend
      - name: Generate backend coverage
        shell: bash
        run: cargo llvm-cov --lib --all-features --no-fail-fast --lcov --output-path coverage/component/backend/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-component-backend
          path: coverage/component/backend/lcov.info
          retention-days: 14

  frontend-component:
    name: Tests (Frontend) - Component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Frontend component gate
        run: npm ci && npm run typecheck

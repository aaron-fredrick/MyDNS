# MyDNS Configuration (TOML format)

[server]
bind_host = "127.0.0.1"
dns_port = 53
http_host = "127.0.0.1"
http_port = 8080
run_as_user = "nobody"
run_as_group = "nobody"

[database]
path = "mydns.db"

[auth]
admin_username = "admin"
admin_password = "CHANGE_ME"

[resolver]
mode = "recursive"
priority = "cloudflare_first"
cloudflare_dns = "1.1.1.1:53"

# Root hints used in recursive mode (mode = "recursive").
# These are the 13 IANA root server IPv4 addresses.
# When omitted the built-in defaults below are used automatically.
# Uncomment and modify to override.
#root_hints = [

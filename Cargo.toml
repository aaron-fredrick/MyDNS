[package]
name = "mydns"
version = "0.1.0"
edition = "2021"
authors = ["MyDNS"]
description = "High-performance DNS server and management dashboard"

[[bin]]
name = "mydns"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio        = { version = "1",    features = ["full"] }
tokio-util   = { version = "0.7",  features = ["rt"] }
tokio-stream = "0.1"

# DNS protocol
hickory-server   = { version = "0.24", features = ["resolver"] }
hickory-proto    = "0.24"
hickory-resolver = { version = "0.24", features = ["tokio"] }

# HTTP / WebSocket
axum       = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Auth
argon2       = "0.5"
jsonwebtoken = "9"

# Logging / tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender    = "0.2"

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono      = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
anyhow      = "1"
thiserror   = "1"
once_cell   = "1"
uuid        = { version = "1", features = ["v4"] }
rand        = "0.8"
async-trait = "0.1"
async-recursion = "1"
local-ip-address = "0.6"
dotenvy     = "0.15"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["securitybaseapi", "processthreadsapi", "winnt", "handleapi"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user", "process"] }

[dev-dependencies]
tokio   = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.11", features = ["json"] }

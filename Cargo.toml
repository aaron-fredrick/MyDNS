[package]
name = "mydns"
version = "0.1.1-dev"
edition = "2021"
authors = ["MyDNS"]
description = "High-performance DNS server and management dashboard"
default-run = "mydns"

[[bin]]
name = "mydns"
path = "src/main.rs"

# Integration tests are deliberately grouped under tests/integration/.
# Explicit targets keep Cargo discovery stable while allowing the repository
# to organize tests by purpose instead of leaving all entry points at tests/.
[[test]]
name = "auth_coverage"
path = "tests/integration/auth_coverage.rs"
[[test]]
name = "blocklist_integration"
path = "tests/integration/blocklist_integration.rs"
[[test]]
name = "cache_persistence"
path = "tests/integration/cache_persistence.rs"
[[test]]
name = "dns_integration"
path = "tests/integration/dns_integration.rs"
[[test]]
name = "api_integration"
path = "tests/integration/integration.rs"
[[test]]
name = "local_dns_integration"
path = "tests/integration/local_dns_integration.rs"
[[test]]
name = "upstream_integration"
path = "tests/integration/upstream_integration.rs"
[[test]]
name = "validation_api"
path = "tests/integration/validation_api.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
tokio-util   = { version = "0.7",  features = ["rt"] }
tokio-stream = "0.1"
hickory-server   = { version = "0.26.1", features = ["resolver"] }
hickory-proto    = "0.26.1"
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
axum       = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros"] }
# Keep the TLS implementation on the patched 0.23.45 line used by SQLx.
rustls = "0.23.45"
argon2       = "0.5"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender    = "0.2"
tracing-samply      = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
chrono      = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
anyhow      = "1"
thiserror   = "1"
once_cell   = "1"
uuid        = { version = "1", features = ["v4"] }
rand        = "0.8"
async-trait = "0.1"
async-recursion = "1"
local-ip-address = "0.6"
dotenvy     = "0.15"
rust-embed = "8.12.0"
mime_guess = "2.0.5"
colored = "3.1.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["securitybaseapi", "processthreadsapi", "winnt", "handleapi"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user", "process"] }

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util"] }
reqwest  = { version = "0.12", features = ["json"] }
tempfile = "3"
